services:
  fleet-server:
    image: elastic/elastic-agent:${ELK_VERSION:-9.2.3}
    container_name: elastic-fleet-server
    hostname: fleet-server
    restart: unless-stopped
    user: root

    environment:
      # --- Fleet Server mode ---
      - FLEET_SERVER_ENABLE=true

      # --- Elasticsearch connection (fleet-server component) ---
      - FLEET_SERVER_ELASTICSEARCH_HOST=https://elasticsearch:${ELASTICSEARCH_PORT:-9200}
      - FLEET_SERVER_ELASTICSEARCH_USERNAME=${ELASTIC_USERNAME:-elastic}
      - FLEET_SERVER_ELASTICSEARCH_PASSWORD=${ELASTIC_PASSWORD}
      - FLEET_SERVER_ELASTICSEARCH_CA=/certs/ca/ca.crt
      - FLEET_SERVER_ELASTICSEARCH_INSECURE=true

      # --- Elastic Agent output to ES (agent's own output) ---
      - ELASTICSEARCH_HOSTS=https://elasticsearch:${ELASTICSEARCH_PORT:-9200}
      - ELASTICSEARCH_USERNAME=${ELASTIC_USERNAME:-elastic}
      - ELASTICSEARCH_PASSWORD=${ELASTIC_PASSWORD}
      - ELASTICSEARCH_CA=/certs/ca/ca.crt

      # --- Fleet Server identity & enrollment ---
      - FLEET_SERVER_SERVICE_TOKEN=${FLEET_SERVER_SERVICE_TOKEN}
      - FLEET_SERVER_POLICY_ID=${FLEET_SERVER_POLICY_ID:-fleet-server-policy}

      # --- Self-enrollment URL (must be reachable from inside container) ---
      - FLEET_URL=https://fleet-server:8220

      # --- Listen settings inside container ---
      - FLEET_SERVER_HOST=0.0.0.0
      - FLEET_SERVER_PORT=8220

      # --- TLS for Fleet Server ---
      - FLEET_SERVER_CERT=/certs/fleet-server/fleet-server.crt
      - FLEET_SERVER_CERT_KEY=/certs/fleet-server/fleet-server.key

      # --- Skip TLS verification for self-signed certs (bootstrap) ---
      - FLEET_SERVER_INSECURE_HTTP=false
      - FLEET_INSECURE=true

    ports:
      - "8220:8220"
      - "9001:9001/udp"  # pfSense syslog

    volumes:
      - ./secrets/certs:/certs
      - fleet-server-data:/usr/share/elastic-agent/data
      - fleet-server-state:/usr/share/elastic-agent/state
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /home/admsrv/ib_jesse/logs:/jesse-logs:ro

    networks:
      - elastic

    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  fleet-server-data:
  fleet-server-state:

networks:
  elastic:
    external: true
