# ===========================================================================
# Grafana Dashboard for ElasticDocker
# ===========================================================================
# Usage: docker compose -f docker-compose.yml -f docker-compose.grafana.yml up -d grafana
#
# Access: http://localhost:3000 (admin/admin on first login)
# ===========================================================================

services:
  grafana:
    image: grafana/grafana:latest
    container_name: elastic-grafana
    restart: unless-stopped
    environment:
      # Admin credentials
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      # Server settings
      - GF_SERVER_ROOT_URL=https://grafana.elastic.local
      - GF_SERVER_DOMAIN=grafana.elastic.local
      # Disable analytics
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      # Plugins - install manually if needed
      # - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-piechart-panel
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    networks:
      - elastic
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.elastic.local`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls=true"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

volumes:
  grafana-data:

networks:
  elastic:
    external: true
